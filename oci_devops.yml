version: 0.1 
component: build
timeoutInSeconds: 600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm22-ee-java17

  exportedVariables:
    - BuildServiceDemoVersion

steps:
  - type: Command
    name: "Install GraalVM Enterprise 22.x Native Image for Java17"
    command: yum -y install graalvm22-ee-17-native-image

  - type: Command
    name: "Set PATH Variable"
    command: export PATH=$JAVA_HOME/bin:$PATH

  - type: Command
    name: "Docker Login"
    command:  cd MtdrSpring;
              oci os object get --bucket-name reacttodo-l1mh9 --name deployment_config.tgz --file deployment_config.tgz;
              tar -xzvf deployment_config.tgz;
              source env.sh;
              cat at.cfg | docker login -u "axc45eys7hf0/a01772130@tec.mx" --password-stdin mx-queretaro-1.ocir.io

  - type: Command
    name: "Install K8s"
    command: mkdir -p $HOME/.kube;
      cd $HOME;
      mkdir k8s;
      cd k8s;
      wget https://dl.k8s.io/v1.31.2/bin/linux/amd64/kubectl;
      chmod +x kubectl;
      export PATH=$PATH:$HOME/k8s;
      cd ..;
      cd .kube;
      oci ce cluster create-kubeconfig --cluster-id ocid1.cluster.oc1.mx-queretaro-1.aaaaaaaal3uidrtvo236xosw6bm3r7ahq4lpdav52za4vuuykcjiszigrgnq --file $HOME/.kube/config --region mx-queretaro-1 --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT;
      export KUBECONFIG=$HOME/.kube/config;

  - type: Command
    name: "Undeploy"
    command:  cd MtdrSpring;
              source env.sh;
              (cd backend;source undeploy.sh)
              
  - type: Command
    name: "Build"
    command:  cd MtdrSpring;
              source env.sh;
              (cd backend;source build.sh)
